# Theory validation — fixed before execution.
# Everything here is either an exact identity check or a closed-form geometry
# statistic. No dynamics are integrated, so nothing here can be tuned.
[grid]
n        = [2, 3, 4, 5, 6, 7, 8]
B_total  = 1.0          # E0 = B_total / n  (Corollary A.1 budget normalisation)
eta      = 1.0
[geometry]
# window lengths for P(l) and W(l)  (Proposition D)
ell      = [0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.3333]
grid_N   = 200000
[containment]
# exact constant-attack containment r*(A) (Theorem C). Log-spaced, deliberately
# NOT aligned to powers of 3 or of 3/2, so no ternary scale is privileged.
logA_min = -1.3
logA_max = 1.4
n_A      = 61
r0       = 0.2
fields   = ["linear", "cubic", "bistable"]
[replicates]
layout_seeds = 24       # for B4_random / B5_shuffled / B6_center_anchored
